# ── Render Infrastructure-as-Code Blueprint ────────────────────────
# https://render.com/docs/blueprint-spec
#
# Push this repo to GitHub, then on Render → New → Blueprint → select repo.
# Render will auto-create the web service and database defined below.

services:
  - type: web
    name: mu-innovation-hub-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120 --access-logfile -
    rootDir: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mu-innovation-hub-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: FRONTEND_URL
        value: "https://your-app.vercel.app"  # ← UPDATE after Vercel deploy
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false  # set manually in Render dashboard
      - key: GOOGLE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.8"

databases:
  - name: mu-innovation-hub-db
    plan: free
    region: oregon
    databaseName: incubation_db
    user: incubation_user
